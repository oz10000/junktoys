name: 🧸 Mostrar Ranking en Consola
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'  # cada 6 horas

jobs:
  ranking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt
      - name: Ejecutar ranking
        run: python scripts/console_ranking.py
      - uses: actions/upload-artifact@v4
        with:
          name: ranking-output
          path: ranking_output.txt
